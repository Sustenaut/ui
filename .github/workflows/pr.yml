# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: pr

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-node-test.yml@7914b2abb933747e303f5f981d8335d3704dcdb3 # v0.21.0

  audit:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-node-audit.yml@7914b2abb933747e303f5f981d8335d3704dcdb3 # v0.21.0

  osv:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-osv.yml@7914b2abb933747e303f5f981d8335d3704dcdb3 # v0.21.0

  review:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-review.yml@7914b2abb933747e303f5f981d8335d3704dcdb3 # v0.21.0

  sonar:
    name: ci
    needs: [test]
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@7914b2abb933747e303f5f981d8335d3704dcdb3 # v0.21.0
    with: {"reports": "sonar.javascript.lcov.reportPaths=*"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [test, audit, osv, review, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }
