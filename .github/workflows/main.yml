# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: main

on:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  # Whether an earlier run already passed on this commit's tree: then the
  # jobs it ran are skipped, and nothing here tests less than it did.
  tested:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-tested.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0
    with: {"workflow": ".github/workflows/pr.yml"}
    permissions:
      actions: read
      contents: read

  test:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-node-test.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0

  audit:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-node-audit.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0

  osv:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-osv.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0

  sonar:
    name: ci
    needs: [tested, test]
    if: ${{ !failure() && !cancelled() }}
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0
    permissions:
      actions: read
      contents: read
    with: {"reports": "sonar.javascript.lcov.reportPaths=*", "coverage-run": "${{ needs.tested.outputs.run-id }}"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded or, where an earlier run already passed on the
  # commit's tree, was skipped for it. None is skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [tested, test, audit, osv, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg tested "$TESTED" '.tested.result == "success"
            and all(.[]; .result == "success" or (.result == "skipped" and $tested == "true"))' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}', TESTED: '${{ needs.tested.outputs.tested }}' }
